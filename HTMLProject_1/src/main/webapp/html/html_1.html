				- 응답 시에 브라우저에 출력

				- 사용하는 언어의 역할
					1. HTML / CSS
						=> Only 화면(정적) => 화면 출력만 하고 기능은 없다
						=> 사용자 정의가 없다 => 표준화
						=> HTML => 태그/속성
					2. JavaScript
						=> 브라우저 안에서 사용자 요청 처리(이벤트)
						=> 애니메이션, 동적 페이지(데이터 변경 가능)
						=> 라이브러리 : JQuery(Ajax), Vue, React, nodeJs
						1차 프로젝트(JSP) => JQuery(Ajax)
						2차 프로젝트(SpringBoot) => Thymeleaf
							=> CI/CD => Vue(Pinia)
					3. Java
						=> 요청 받기 => 요청 처리 => 데이터 관리
						HttpServletRequest : 요청
						HttpServletResponse : 응답
					4. Oracle
						공유된 데이터 저장(사이트에 필요한 데이터 저장)
						SQL(DML(INSERT,UPDATE,DELETE,SELECT))

					- 403 : 서버 접근 거부 => Spring에서 보안
					- 412 : 전송값이 틀린 경우
					- 415 : 한글 	변환이 틀린 경우 => UTF-8 / ECU-KR
					- 400 : POST/GET 인지 확인이 안되는 경우
					- **500 : JSP에서 자바 문법 에러시
