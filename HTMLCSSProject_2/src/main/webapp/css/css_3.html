<!-- 
	자손, 후손, 동위 선택자
	----------------- 크로링
	
	태그 > 태그 // 자손 선택자
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
.aaa > img {
	border-radius: 50px;
}
.bbb > img {
	border-radius: 20px;
}
.ccc > img {
	border-radius: 100px;
}
div > p+h1 {
	background: rgb(0,255,255);
	color: green;
}
div span h1 {
	background: #B520FF
}
div>p~h1 {
	background: #ccccff;
}

/* 
	div > h1 // 자손 태그들만
	div h1   // h1 전체 포함
 */
</style>
</head>
<body>
	<div class="aaa">
		<img src="../images/m1.jpg">
	</div>
	<div class="bbb">
		<img src="../images/m2.jpg">
	</div>
	<div class="ccc">
		<img src="../images/m3.jpg">
	</div>
	<div class="aaa">
		<img src="../images/m4.jpg">
	</div>
	<div class="bbb">
		<img src="../images/m5.jpg">
	</div>
	<hr>
	<div>
		<p>Hello CSS</p>
		<h1>형제1</h1>
		<h1>형제2</h1>
		<span>
			<h1>후손1</h1>
		</span>
	</div>
</body>
</html>
