<!-- 
	<a> : 링크 태그 => 가장 많이 등장 => 메뉴/버튼/문자
		- 페이지 이동
		- 파일 다운로드
		- 전화, 이메일 연결
		- 상세 보기
		- 주요 속성
			- href : 이동할 파일명 지정
			- target : _blank: 새탭 열기 / _self: 현재 창(default)
			- title : 부가 설명

 -->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<a href="https://www.daum.net">다음</a>
	<a href="https://www.naver.com" target="_blanks">네이버</a>
</body>
</html>
