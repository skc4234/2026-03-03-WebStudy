<!-- 
	Chapter02
	HTML 구조  + 작성법
	인터넷을 통해서 데이터를 전달하는 파일
	=> 브라우저에서는 ML인 경우에만 사용 가능 => HTML, XML, WML, ...
									브라우저 화면 출력
									XML : 설정파일(MyBatis, Spring 등)
										=> Annotation / SpringBoot로 XML 대체
	SpringFramework : 유지보수
	=> HTML의 기본 용어
	태그 + 속성
	<meta charset="UTF-8">
	 ---- -------
	 태그   속성 => ML(MarkUpp Language)
	      - 멤버변수 : 사용자 정의가 있다(데이터 저장)
	- 클래스 : 사용자 정의가 없다
	
	1) 태그의 종류
		여는 태그 : <태그>
		닫는 태그 : </태그>
		---------------- 동시에 사용 => <태그>출력 데이터</태그>
		독립 태그 : <태그> => 닫는 태그 사용 x => img, input, br, p
		------------------------
		1. 값을 가지고 있는 태그
			<h1>출력값</h1>
		2. 값이 없는 태그
			<br>,<hr>
		3. 속성에 값이 있는 태그
			<img src="">, <a href="">
			
	2) 단점
		- 인터프리터 방식 : 한 줄씩 번역
		- 컴파일이 없어서 에러가 없다 => 개발자도구의 콘솔로 출력해서 확인
	3) 그와 속성은 소문자로만 사용(HTML4는 혼용가능했지만 HTML5는 아님)
	4) 태그 : 어떤 내용을 출력(화면 출력 확인)
	   속성 : 어떤 값을 가지고 있는지
	5) inline : 가로 출력
	   block : 세로 출력
	   
	   문자와 관련된 태그
	   1. 타이틀(제목) => h1~h6 => 숫자가 커질수록 문자는 작아진다
	   		bold
	   		
	*** 들여쓰기, 모든 태그/속성은 소문자
	   
	   
 -->
<!DOCTYPE html> <!-- HTML5 버전에 해당되는 태그/속성 읽어옴 -->
<html> <!-- HTML 문서의 시작 => 생략 가능 -->
<head> <!--  설정 파일 -->
<meta charset="UTF-8"> <!-- 검색어, 화면크기, 한글 설정 -->
<title>Insert title here</title> <!-- 브라우저 이름 부여 -->
<!-- CSS/JavaScript -->
<!-- <script><style><link> => 화면 출력안됨 -->
</head>
<body>
<!-- 화면 출력 => static => 코딩한 순서로 출력 -->
<!--
	문자와 관련된 태그
	멀티미디어
	이동 태그
	입력 태그
	목록 태그
	div / span => JPanel => 카드
	기타
	시멘텍 태그
	
	1. heading 태그 : <h1~h6>
-->
	<h1>Hello HTML!!</h1>
	<h2>Hello HTML!!</h2>
	<h3>Hello HTML!!</h3>
	<h4>Hello HTML!!</h4>
	<h5>Hello HTML!!</h5>
	<h6>Hello HTML!!</h6>
</body>
</html>
