<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
* {
	background-color: gray;
}
h1 {
	color: black;
	background-color: white; 
}
h1#red {
	color: red;
}
h1#orange {
	color: orange;
}
h1#yellow {
	color: yellow; 
}
h1#green {
	color: green;
}
h1.cyan {
	color: aqua;
}
h1.blue {
	color: blue;
}
h1#purple {
	color: purple; 
}
</style>
</head>
<body>	
	<!-- 중복이 없는 경우: ID 설정 -->
	<!-- red -->
	<h1 id="red">Java</h1>
	<!-- orange -->
	<h1 id="orange">Oracle</h1>
	<!-- yellow -->
	<h1 id="yellow">JSP</h1>
	<!-- green -->
	<h1 id="green">HTML/CSS</h1>
	<!-- cyan -->
	<h1 class="cyan">JavaScript</h1> <!-- VueJS, React는 자바스크립트 라이브러리 -->
	<!-- blue -->
	<h1 class="blue">Spring</h1>
	<!-- purple -->
	<h1 id="purple">CI/CD</h1>
</body>
</html>
