<!-- 
	멀티미디어 태그
		<img> => 이미지
		<embed>, <iframe> : 동영상 출력 가능
	
	- <img> : 이미지 출력
		=> 상품 목록 / 썸네일, 상세 보기
		- 주요 속성
			- src: 출력할 이미지 파일명
			- title/alt: 풍선 도움말
			- width/height: 이미지 크기 결정
			
		- 사용법
		<img src="" title="">
		html파일과 동일한 위치 => 파일명만
		다른 위치 => ../폴더명/파일명

 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<img src="m1.jpg" title="영화명:마이클" width=150 height=250><br>
	<img src="m1.jpg" title="영화명:마이클" width=10%><br>
	<!-- height는 자동 조정 -->
</body>
</html>
