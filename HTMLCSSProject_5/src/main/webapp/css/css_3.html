<!-- 
	글자 속성
	- font / text
		- *color* : 글자 색상
		- *font-size* : 글자 크기 => px / em
		- font-weight : 두께(normal / bold, 100~900)
		- *font-family* : 글꼴(시스템 글꼴 / 구글 폰트)
		- *text-align* : 정렬(left, center, right)
		- *text-decoration* : underline / none => a 태그 밑줄 지우는 용도
		- text-transform : 대소문자 변환 => 거의 안쓰임
		- letter-spacing : 글자 간격
		- word-spacing : 단어 간격
		- *line-height* : 줄 간격(자간)
		- *white-space* : 자동 줄바꿈
		- text-shadow : 그림자 효과
		- *font* : 단축 속성
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>글자 속성</h1>
	<h2>1. color: 글자 색상</h2>
	<h2>2. font-size: 글자 크기</h2>
	<!-- 
		em(배수) / px / %
		h2 사이즈 : 16px
		2em : 32px
	 -->
	<h2>3. font-weight: 글자 두께</h2>
	<h2>4. font-family: 글꼴</h2>
	<h2>5. text-align: 글자 정렬</h2>
	<h2>6. text-decoration: 밑줄</h2>
	<h2>7. text-transform: 대소문자 변환</h2>
	<h2>8. letter-spacing: 글자 간격</h2>
	<h2>9. word-spacing: 단어 간격</h2>
	<h2>10. line-height: 줄 간격</h2>
	<h2>11. white-space: 자동 줄 바꿈</h2>
	<h2>12. text-shadow: 그림자</h2>
	<h2>13. font: 단축 속성</h2>

</body>
</html>
