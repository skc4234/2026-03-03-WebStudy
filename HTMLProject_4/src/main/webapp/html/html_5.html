<!-- 
	입력 관련 태그
	<input> <textarea> <select>
	
	<input>
		- 속성
			- type
				- text : 한 줄 문자열 => ID, 이름, 이메일 등
				- password : 비밀번호 입력
				- file : 파일 업로드
				- hidden : 감추는 태그
				- date : 달력
				- number : 숫자 카운트 업/다운
				- range : 슬라이더 바
				- button : 일반 버튼 => JavaScript로 기능추가
				- radio : 같은 그룹 내에서 하나만 선택 => name 속성으로 그룹화
				- checkbox : 여러개 동시에 체크
				- submit : 전송 버튼 => HTML에서 값 입력 => Java에서 처리 => 오라클 => 화면 이동
													  sendRedirect()("이동파일")
													 ex) 로그인/회원가입 후 메인 화면으로 이동
				- image : submit과 동일한 기능
			- name => Java로 값 전송 시에 사용
			- size
			- id, class => CSS/JavaScript
	<button> : submit과 동일한 기능 / 일반 버튼
	<textarea> : 여러줄 입력(rows, cols 속성으로 조절)
	<select> : 콤보박스
		<option>내용</option>
 -->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="table.css">
<style type="text/css">
h3 {
	text-align: center;
}
table {
	margin: 0px auto; /*가운데 정렬*/
}
</style>
</head>
<body>
	<h3>회원 가입</h3>
	<form>
	<!-- width 대신 style 사용 -->
	<table id="table_content" style="width: 600px">
	<tr>
		<th width=15%>아이디</th>
		<td width=85%><input type="text" size=20><input type="button" value="중복체크"></td>
	</tr>
	<tr>
		<th width=15%>비밀번호</th>
		<td width=85%>
			<input type="password" size=20>
			<input type="password" size=20 placeholder="재입력">
		</td>
	</tr>
	<tr>
		<th width=15%>이름</th>
		<td width=85%><input type="text" size=20></td>
	</tr>
	<tr>
		<th width=15%>성별</th>
		<td width=85%>
			<input type="radio" name=sex checked>남자
			<input type="radio" name=sex>여자
		</td>
	</tr>
	<tr>
		<th width=15%>나이</th>
		<td width=85%><input type="number" min="10" max="90" value="20"></td>
	</tr>
	<tr>
		<th width=15%>만족도</th>
		<td width=85%><input type="range" min="1" max="5"></td>
	</tr>
	<tr>
		<th width=15%>생년월일</th>
		<td width=85%><input type="date" size=30></td>
	</tr>
	<tr>
		<th width=15%>이메일</th>
		<td width=85%><input type="text" size=30 placeholder="example@example.com"></td>
	</tr>
	<tr>
		<th width=15%>우편번호</th>
		<td width=85%><input type="text" size=7 readonly></td>
	</tr>
	<tr>
		<th width=15%>주소</th>
		<td width=85%><input type="text" size=30 readonly></td>
	</tr>
	<tr>
		<th width=15%>상세주소</th>
		<td width=85%><input type="text" size=30></td>
	</tr>
	<tr>
		<th width=15%>전화번호</th>
		<td width=85%>
			<select>
				<option>010</option>
			</select>
			&nbsp;
			<input type="text" size=10 placeholder="0000-0000">
		</td>
	</tr>
	<tr>
		<th width=15%>취미</th>
		<td width=85%>
			<input type="checkbox">여행
			<input type="checkbox">게임
			<input type="checkbox">영상 시청
			<input type="checkbox">사진 찍기
			<input type="checkbox">운동
		</td>
	</tr>
	<tr>
		<th width=15%>사진</th>
		<td width=85%>
			<input type="file" size=30>
		</td>
	</tr>
	<tr>
		<th width=15%>보안</th>
		<td width=85%>
			<input type="hidden" size=30>
		</td>
	</tr>
	<tr>
		<th width=15%>소개</th>
		<td width=85%>
		<!-- textarea : 여러줄 입력, rows:height, cols:width -->
			<textarea rows="10" cols="45"></textarea>
		</td>
	</tr>
	<tr>
	<!-- th+td => colspan -->
		<td colspan="2" align="center">
			<input type="submit" value="회원가입">
			<input type="button" value="취소">
		</td>
	</tr>
	</table>
	</form>
</body>
</html>
