	1. CSS는 HTML과 상관없이 독립적으로 디자인 변경이 가능하다
	2. CSS 종류
		- 내부 CSS
			- 파일 1개 제어
			<head>
				<style>

		- 인라인 CSS

			<a href="" style=""> // 우선순위가 높다
		- 외부 CSS

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
img {
	border: 3px solid green;
	border-radius: 20px; 
}
.img1 {
	width: 150px;
	height: 200px;
}
.img2 {
	width: 200px;
	height: 300px;
}
</style>
</head>
<body> 
	<img src="../images/m1.jpg" class="img img1">
	<img src="../images/m2.jpg" class="img img1">
	<img src="../images/m3.jpg" class="img img1">
	<img src="../images/m4.jpg" class="img img2">
	<img src="../images/m5.jpg" class="img img2">
	<img src="../images/m6.jpg" class="img img2">
	<img src="../images/m7.jpg" class="img img2">
</body>
</html>
