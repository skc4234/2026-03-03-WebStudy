<!-- 
	선택자 : 태그를 가지고 와서 CSS를 이용하여 디자인
		   --------- 어떤 태그에 적용할지
	기본 선택자 : 태그, id, **class 선택자
	

 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
/* 태그 선택자 : 공통으로 적용되는 부분(크기, 여백 등) */
img {
	width: 160px;
	height: 250px;
}
.red {
	border: 4px solid red;
	opacity: 0.4 /* 0.0~1.0 투명도 */
}
#green {
	border: 4px solid green; /* ; */
	border-radius: 100px;
}
</style>
</head>
<body>
	<img src="../images/m1.jpg" title="">
	<img src="../images/m2.jpg" title="" class="red"> <!-- 테두리 : red -->
	<img src="../images/m3.jpg" title="">
	<img src="../images/m4.jpg" title="" class="red"> <!-- 테두리 : red -->
	<img src="../images/m5.jpg" title="">
	<img src="../images/m6.jpg" title="" class="red"> <!-- 테두리 : red -->
	<img src="../images/m7.jpg" title="" id="green"> <!-- 테두리 : green -->
	<br>
	<a href="css_3.html"><button>이전</button></a>
</body>
</html>
