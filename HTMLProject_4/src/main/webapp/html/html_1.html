<!-- 
	교재 정리
	1장 : 웹 개요 / 실습 환경 구축
		- 브라우저 : 크롬 / 파이어폭스
		- 웹 서버 : 아파치 서버 - 톰캣(WAS)
			- WAS : Web Application Server => JSP를 번역해서 HTML로 변환
		- 편집기 : Eclipse, VSCode-VueJS, WebStorm-React
		- 데이터베이스 : Oracle, MySQL, MariaDB
	- 인터넷과 웹(19page)
		- 인터넷은 통신망
		- 웹은 서비스 => 정보 공유
		- 문서 전송 => HyperText
		- 웹 사용 => 브라우저(Markup Language) => HTML(화면 UI), XML(설정 파일, 문서형 데이터베이스)
		- MyBatis, Spring => XML 설정
		- XML 포함하면 무거움 => yml(.yarn) => CI/CD, annotaion => SpringBoot
		- ML을 표준화 : W3C => WWW
	- 웹 표준(23page)
		- Web 2.0 : 동적 페이지(JQuery, Ajax, VueJS, React)
		- HTML : HTML5
		- CSS : CSS3
		- JavaScript : ES6.0
	- 웹 동작(28page)
		- Client / Server 구조
		- Client : 브라우저에 요청(Request) 보내기 => 주소를 통해서 => Front-End
		- Server : 요청을 받아서 처리후에 응답(Response) => HTML로 전송 => Back-End
	- HTML의 역할
		- 정적 페이지(파일=>페이지)
			- 데이터를 변경할 수 없다
		- 동적 페이지(JSP-Java, PHP, ASP-C#, DJango-Python(AI))
	- 동작 방법
		- 인터프리터(한줄씩 읽어서 출력) => 문법상의 오류는 없다 => 에러 출력이 없다
		- HTML 문서를 브라우저에 올림 => 태그를 번역 => 화면 출력
	- 웹 서버 오류
		- 404 : 파일명이 틀린 경우	
		- 500 : 자바와 연동 시 자바에서의 오류
		- 403 : 접근 거부
		- 412/415/400 : JSP 연동 시 JSP 오류
	- HTML/CSS => Only 화면 UI => 기능은 없다 => 사용자 정의가 없다 => 응용x
		- 표준화 => 모든 개발자가 동일하게 사용
		- 퍼블리셔가 개발
	- HTML 태그의 종류
		- 여는 태그 / 닫는 태그
			- <h1>Hello</h1>
		- 독립 태그
			- <br>, <img>, <input>
	- HTML 형식
		<!DOCTYPE html>
		<html>
		<head>
			<meta> : 한글 변환 => UTF-8 / EUC-KR
			<script> : 자바스크립트
			<style> : CSS
			<link> : CSS 파일 읽어오기
			<title> : 브라중저 제목
			  
		</head>
		<body>
		</body>
		</html>
	- HTML 기본 태그(51page)
		- <img src="">
		   태그  속성
		   - 필요시에는 사용자 정의 속성이 가능 - JQuery, Ajax, VueJS, React
		   
		- 내용을 가지고 있는 태그
			<h1>내용</h1> => <h1>~<h6>
			<p>내용</p>
			목록 태그(ul, ol, li,...), 텍스트 관련(b, i, font, strong,...)
		- 내용이 없는 태그
			- 닫는 태그 없이 독립 태그로 사용하는 경우
			<img>, <input>, <br>, <hr>,...
			
	- 태그의 종류
		- 문자 태그
			- 문자 안에서 텍스트의 의미, 강조 등을 표현하는 태그
			- 글 컨텐츠 구성
			- 주요 태그
				- <br> : 다음 줄에 출력(\n)
				- <p> : 단락 나누기
				- <strong> : bold체
				- <h1>~<h6> : 제목(h1, h3)
				- <sup> : 위첨자
				- <hr> : 라인선
				- <pre> : 있는 그대로 출력
			- 모든 태그는 id, class, style 속성을 가지고 있다
				- 구분자로 CSS, JavaScript를 적용할 수 있다
				- id는 중복이 없는 구분자 => 각 파일에 한개 존재(#)
				- class는 중복이 가능한 구분자(.)
				- CSS, JavaScript 사용 시 원하는 태그를 찾을 수 있다
				
				
				
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
/* 
	내부 CSS : 파일 한개
	인라인 CSS : 태그 한개
	외부 CSS : 파일로 만듦 => 공통으로 적용	

 */
#red {
	background-color: red;
}
.green {
	background-color: green;
}
a {
	background-color: orange;
}
</style>
</head>
<body>
	<!-- h태그 => block 속성 : 한줄 전체를 차지 
		inline 속성 : 글자 크기만 차지
	-->
	<h1 id="red">Red</h1>
	<h1 id="blue">Blue</h1>
	<h1 class="green">Green</h1>
	<h1 id="yellow">Yellow</h1>
	<h1 class="white">White</h1>
	<a href="#" style="color: green">Hello HTML</a>
	<hr style="color: blue; size: 20px;">
	
</body>
</html>
