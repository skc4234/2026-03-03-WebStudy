<!-- 
	속성
	- 박스 속성
		- margin
		- padding
		- border
	- 가시 속성
		- display
		- overflow
	- 배경 속성
		- background-color
		- background-image
	- 위치 속성
		- 절대 좌표
		- 상세 좌표
		- 그대로 출력
		- 고정 위치
	- 유동 속성
		- float, z-index
	- 반응형
		- 해상도에 따라 변함
		- Layout(HTML5 시맨틱 태그-header/section/footer/nav/aside)
		- 카드 디자인
		
	- 박스 속성
	---------------------
	 margin : 외부 여백 지정
	---------------------
	 border : 테두리
	---------------------
	 padding : 내부 여백 지정
	---------------------
	 content : 이미지 / 문자
	---------------------
	
	margin : top - right - bottom - left
		- 시계방향
	margin : 0px auto : 가운데 정렬
	한개씩 사용
		- margin-top
		- margin-right
		- margin-bottom
		- margin-left
