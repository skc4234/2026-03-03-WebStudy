<!-- 속성 선택자 -->
<!-- 
	id/class 선택자 : div, span, h1, h3 태그 등
	- input / select / textarea / table / ul / dl
	 => id나 class를 설정하지 않음 => 속성 선택자 / 구조 선택자
	
	속성 선택자
		선택자[속성=값] => 같은 값일때
		선택자[속성^=값] => 시작 값일때
		선택자[속성$=값] => 끝 값일때
		선택자[속성*=값] => 포함 값일때
		
	- 사용처 : <img> 태그에서 src 속성에서 확장자명(.png/.jpg)이 아닌 태그 찾을때 사용
			 <input> 태그에서 type 속성 구별할때 사용
			 <a> 태그에서 href 속성 구별할때 사용
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
a, input {
	/* 공통 적용 부분 */
	display: block;
}
a[href="https://www.java.com"] {
	color: red;
}
a[href^="http"] {
	color: orange;
}
a[href$="net"] {
	color: magenta;
}
a[href*="www"] {
	color: black;
}
input[type="text"] {
	border-radius: 20px;
}
input[type="password"] {
	background-color: yellow;
}
input[type="submit"] {
	background-color: aqua;
}
input[type="button"] {
	background-color: red;
}
</style>
</head>
<body>
	<a href="http://www.java.com">자바</a>
	<a href="https://www.oracle.net">오라클</a>
	<a href="www.html.com">HTML</a>
	<a href="http://www.css.net">CSS</a>
	<a href="http://www.javascript.co.kr">자바스크립트</a>
	<input type="text" size=20>
	<input type="password" size=20>
	<input type="file" size=20>
	<input type="submit">
	<input type="button" value="취소">
	<input type="number" min="1" max="1000">
</body>
</html>
