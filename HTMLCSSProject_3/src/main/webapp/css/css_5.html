<!-- 
	박스 모델
		1. 외부 간격 조절 : 태그와 태그 사이의 여백 => margin
			- margin-top
			- margin-right
			- margin-bottom
			- margin-left
		2. 내부 간격 조절 : 태그 안의 이미지 등 컨텐츠와의 여백 => padding
			- padding-top
			- padding-right
			- padding-bottom
			- padding-left
		3. 테두리 : border
			- border-style : 선 종류
			- border-width : 두께
			- border-color : 테두리 색상
			- border-collapse : 테두리 통합
			- border-radius : 타원형
			- border: border-style border-width border-color
				- 순서 상관x  	
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
img {
	border: 2px solid red;
	/*border-radius: 15px 30px 50px 70px;*/
	/* top-left top-right bottom-right bottom-left */
	border-top-left-radius: 50px;
	border-bottom-right-radius: 50px;
}
</style>
</head>
<body>
	<img src="../images/m1.jpg">
</body>
</html>
