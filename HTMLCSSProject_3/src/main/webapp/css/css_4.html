<!-- 
	border : 두께 선종류 색상
	         --- ---- ---
	             solid : 일반 라인
	             dotted : 점선
	             dashed : ------
	
	
 -->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
img {
	width: 250px;
	height: 350px;
	margin-left: 10px;
	margin-top: 100px;
}
img:nth-child(1) {
	border: 3px solid red;
}
img:nth-child(2) {
	border: 3px dotted orange;
}
img:nth-child(3) {
	border: 3px dashed yellow;
}
img:nth-child(4) {
	border: 3px double green;
}
img:nth-child(5) {
	border: 3px groove aqua;
}
img:nth-child(6) {
	border: 3px inset blue;
}
img:nth-child(7) {
	border: 3px outset purple;
}
</style>
</head>
<body>
	<img src="../images/m1.jpg">
	<img src="../images/m2.jpg">
	<img src="../images/m3.jpg">
	<img src="../images/m4.jpg">
	<img src="../images/m5.jpg">
	<img src="../images/m6.jpg">
	<img src="../images/m7.jpg">
</body>
</html>
