<!-- 
	멀티미디어 태그 - embed / iframe
	- embed 태그 : 동영상 실행
	- iframe 태그 : 다른 html 읽어오기, 동영상도 가능 
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>imbed, iframe</title>
</head>
<body>
<!-- 값 설정 =>  바로 실행 -->
	<embed src="https://youtube.com/embed/QgiRK3_qPWk\u0026list=RDQgiRK3_qPWk\u0026start_radio=1\u0026pp=ygUIa2lraSA0MDSgBwE%3D"
	width="540", height="400"></embed>
	<iframe src="https://youtube.com/embed/QgiRK3_qPWk\u0026list=RDQgiRK3_qPWk\u0026start_radio=1\u0026pp=ygUIa2lraSA0MDSgBwE%3D"
	width="540", height="400"></iframe>
	<iframe src="html_5.html" width="500" height="500"></iframe>
	<!-- <jsp:include> -->
</body>
</html>
